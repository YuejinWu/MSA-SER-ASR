model_cfg:
  backbone: microsoft/wavlm-base-plus
  local_model_path: models/wavlm-base-plus
  use_mirror: true
  mirror_endpoint: https://hf-mirror.com
  hidden_size: 768
  num_classes: 6
  local_conv_channels:
  - 384
  - 384
  attention_dim: 64
  dropout: 0.4
  adapter_bottleneck: 64
  prototype_momentum: 0.9
  temperature: 0.3
  lambda_pcl: 0.5
train_cfg:
  max_epochs: 50
  lr: 0.0005
  weight_decay: 0.02
  warmup_steps: 800
  label_smoothing: 0.1
  gradient_clip_val: 1.0
  early_stop_patience: 15
  monitor_metric: val/weighted_f1
